<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./js/app.js"></script>
    <title>Case Técnico - Vale Rural</title>
</head>
<body class="bg-[#F5F7F2]">
    <div class="flex flex-col justify-start">
        <header>
            <h1 class="items-center text-center font-bold text-3xl text-[#26352B] pt-5 mb-5">Vale Rural - Esteira de Credito</h1>
        </header>
        <nav class= "flex  flex-col-2 justify-center mt-5" >
            <button id="btn-proposal" class="rounded-tl-lg rounded-tr-lg border-t border-x w-1/3 h-12 px-6 py-3

            <button id="btn-consult" class="rounded-tl-lg rounded-tr-lg border-t border-x w-1/3 h-12 px-6 py-3
                            text-[#e2f0fe]  bg-[#A97855] hover:bg-[#70472F]">Consultar Status</button>
        </nav>
        <main id="content-container" class="rounded-lg mt-[0.2px] mx-8 bg-[#DCE8D9]">
        </main>
    </div>

</html>
